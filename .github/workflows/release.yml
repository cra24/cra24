name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write        # trusted publishing to PyPI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: the tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != version $pkg"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # A tag is not a release. Without this the version is on PyPI and
    # invisible on GitHub: no changelog, nothing to link a CVE report to,
    # and no signed artefacts for anyone who will not install from an index.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: extract this version's changelog section
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # From the heading for this version to the next version heading.
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no CHANGELOG section for $ver" >&2
            exit 1
          fi
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "cra24 ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag \
            dist/*
